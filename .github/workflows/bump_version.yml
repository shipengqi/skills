name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        run: |
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update .claude-plugin/plugin.json version
        run: |
          jq ".version = \"${{ env.NEW_VERSION }}\"" .claude-plugin/plugin.json > .claude-plugin/plugin.json.tmp \
            && mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json

      - name: Update .claude-plugin/marketplace.json version
        run: |
          jq ".metadata.version = \"${{ env.NEW_VERSION }}\"" .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp \
            && mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to v${{ env.NEW_VERSION }}"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "chore/version-bump-v${{ env.NEW_VERSION }}"
          title: "chore: bump version to v${{ env.NEW_VERSION }}"
          body: |
            Bumping version to v${{ env.NEW_VERSION }}
            - Bump type: ${{ github.event.inputs.bump_type }}
            - Updated: `package.json`, `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json`
          labels: |
            version-bump
            automated-pr
